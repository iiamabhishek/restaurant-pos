# Free-tier keep-alive: Render spins down a Free web service after 15 min
# without inbound HTTP (https://render.com/docs/free). This pings the web
# service every 10 min so it stays up through the cafe's active hours.
#
# The ping hits "/" (static page) only — it deliberately does NOT touch the
# backend, so the backend still sleeps (and saves free instance hours) when
# idle; it spins up on demand via the web app's API proxy.
#
# Hours budget (750/month workspace cap): awake ~07:30-02:30 IST = ~19h/day
# for web (~570h) + organic usage ≈ 660/750. Sleeps 02:30-07:30 IST per owner.
#
# Schedule runs on UTC; 02:00-20:59 UTC = 07:30-02:29 IST.
# Note: GitHub Actions cron can fire a few minutes late; harmless here —
# a missed beat just means the service wakes on demand (~1 min cold start).
name: keep-alive

on:
  schedule:
    - cron: "*/10 2-20 * * *"
  workflow_dispatch: {} # manual trigger for testing

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping web service
        run: curl -fsS --max-time 90 https://thetwoyaarcafe-web.onrender.com/ > /dev/null
